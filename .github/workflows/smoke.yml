name: smoke

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore: ["docs/**", "website/**"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "website/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # A debug build keeps the assertions and preconditions, so a broken invariant crashes here.
      - uses: ./.github/actions/build-catwm
        with:
          config: debug
      # The suites share one VM and one build. Each starts its own instance and cleans up after itself.
      - run: |
          status=0
          for suite in app windows workspaces; do
            python3 Tools/smoke.py --suite "$suite" --out "smoke/$suite" || status=1
          done
          exit $status
      - if: always() && hashFiles('smoke/*/summary.md') != ''
        run: cat smoke/*/summary.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: smoke
          path: smoke
          if-no-files-found: warn
