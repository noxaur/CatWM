name: app

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore: ["docs/**", "website/**"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "website/**"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

# One job on one macOS runner: GitHub Free runs 5 macOS jobs at once, and a PR that took five left the
# next PR waiting. Perf and smoke share the one release build.
jobs:
  app:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      # A PR checks out its merge commit, whose first parent is the base, so depth 2 holds the PR's diff.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: ./.github/actions/build-catwm
      # Perf measures only what changes the built app, its fakes or the measuring. A PR that touches
      # none of them skips it, and every push to main measures, so main keeps its profile.
      - id: changes
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet HEAD^1 HEAD -- Sources Package.swift Package.resolved Plugins Resources Info.plist \
            build.sh Tests/Fakes Tools/Perf Tools/perf.py Clients/python .github/workflows/app.yml .github/actions/build-catwm; then
            echo "perf=false" >> "$GITHUB_OUTPUT"
            echo "perf: skipped, this PR changes no code that perf measures." >> "$GITHUB_STEP_SUMMARY"
          fi
      # Perf runs first, on a VM that no smoke suite has touched yet.
      - id: perf
        if: steps.changes.outputs.perf != 'false'
        continue-on-error: true
        run: python3 Tools/perf.py --out perf.md ${{ github.event_name != 'pull_request' && '--profile app-sample.txt' || '' }}
      # Each suite starts its own instance and cleans up after itself.
      - id: smoke
        if: always()
        continue-on-error: true
        run: |
          status=0
          for suite in app windows workspaces; do
            python3 Tools/smoke.py --suite "$suite" --out "smoke/$suite" || status=1
          done
          exit $status
      - if: always()
        run: cat perf.md smoke/*/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: app
          path: |
            perf.md
            app-sample.txt
            smoke
            ~/Library/Logs/CatWM-perf-*.log
          if-no-files-found: warn
      - if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('perf.md') != ''
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs')
            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number
            const marker = '<!-- catwm-perf -->'
            const body = `${marker}\n${fs.readFileSync('perf.md', 'utf8')}`

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            })
            const existing = comments.find(c => c.body?.includes(marker))

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }
      - if: steps.perf.outcome == 'failure' || steps.smoke.outcome == 'failure'
        run: |
          [ "${{ steps.perf.outcome }}" != failure ] || echo "perf: a row is over its budget, or the run failed. See the table in the job summary." >&2
          [ "${{ steps.smoke.outcome }}" != failure ] || echo "smoke: CatWM crashed or hung. See the suite summaries and the app artifact." >&2
          exit 1
