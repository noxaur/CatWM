name = "ouch-report-relay"
main = "worker.js"
compatibility_date = "2025-09-01"

[vars]
# The UUID of the Linear team that reports go to: OUC. Linear's API wants the UUID, not the team prefix
# (Linear → the team's settings → ⌘K → "Copy model UUID").
LINEAR_TEAM_ID = "8185c425-4169-4fa1-b6bc-ded5aeaadbfd"

# Five reports a minute per IP is plenty for real users.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
