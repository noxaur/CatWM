name: perf

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore: ["docs/**", "website/**"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "website/**"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build-catwm
        with:
          config: release
      # A tar keeps the executable bits that an artifact drops. The resource bundles sit at the
      # absolute build path that SwiftPM's bundle accessor falls back to.
      - run: |
          bin=$(cd .build/release && pwd -P)
          bin=${bin#"$PWD/"}
          tar -cf perf-build.tar build/CatWM.app .build/release "$bin/CatWMPerf" "$bin"/*.bundle
      - uses: actions/upload-artifact@v5
        with:
          name: perf-build
          path: perf-build.tar
          retention-days: 1

  measure:
    name: perf measure (${{ matrix.shard }})
    needs: build
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            Tools
            Clients/python
          filter: blob:none
      - uses: actions/download-artifact@v5
        with:
          name: perf-build
      - run: tar -xf perf-build.tar && rm perf-build.tar
      # Each machine runs its share one at a time; the report job merges the three.
      - run: python3 Tools/perf.py --runs 2 --json perf.json --no-check ${{ matrix.shard == 1 && github.event_name != 'pull_request' && '--profile app-sample.txt' || '' }}
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: perf-${{ matrix.shard }}
          path: |
            perf.json
            app-sample.txt
            ~/Library/Logs/CatWM-perf-*.log
          if-no-files-found: warn

  report:
    name: perf
    needs: measure
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: perf-*
          path: shards
      - id: perf
        continue-on-error: true
        run: |
          files=$(find shards -name perf.json)
          test "$(echo "$files" | grep -c .)" -eq 3 || { echo "perf: a machine wrote no samples: $files" >&2; exit 1; }
          python3 Tools/perf.py --merge $files --out perf.md
      - if: always() && hashFiles('perf.md') != ''
        run: cat perf.md >> "$GITHUB_STEP_SUMMARY"
      - if: always() && hashFiles('perf.md') != ''
        uses: actions/upload-artifact@v5
        with:
          name: perf-report
          path: perf.md
      - if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('perf.md') != ''
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs')
            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number
            const marker = '<!-- catwm-perf -->'
            const body = `${marker}\n${fs.readFileSync('perf.md', 'utf8')}`

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            })
            const existing = comments.find(c => c.body?.includes(marker))

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }
      - if: steps.perf.outcome == 'failure'
        run: |
          echo "perf: a row is over its budget, or the run failed. See the table in the job summary." >&2
          exit 1
